apiVersion: v1
kind: ConfigMap
metadata: { name: order-system-config }
data:
  MYSQL_HOST: mysql
  REDIS_HOST: redis
  RABBITMQ_HOST: rabbitmq
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: order-order-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: order-order-service } }
  template:
    metadata: { labels: { app: order-order-service } }
    spec:
      containers:
        - name: app
          image: mall-order-system/order-order-service:1.0.0
          ports: [{ containerPort: 8084 }]
          envFrom: [{ configMapRef: { name: order-system-config } }]
          env:
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: order-system-secrets, key: mysql-password } } }
            - { name: RABBITMQ_PASSWORD, valueFrom: { secretKeyRef: { name: order-system-secrets, key: rabbitmq-password } } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8084 }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8084 }, initialDelaySeconds: 40, periodSeconds: 20 }
          resources: { requests: { cpu: 250m, memory: 384Mi }, limits: { cpu: "1", memory: 768Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: order-order-service }
spec: { selector: { app: order-order-service }, ports: [{ port: 8084, targetPort: 8084 }] }
