server: { port: 8084 }
spring:
  application: { name: order-order-service }
  datasource: { url: "jdbc:mysql://${MYSQL_HOST:localhost}:3306/order_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai", username: "${MYSQL_USER:order}", password: "${MYSQL_PASSWORD:order123456}" }
  data.redis: { host: "${REDIS_HOST:localhost}", port: 6379 }
  rabbitmq:
    host: "${RABBITMQ_HOST:localhost}"
    username: "${RABBITMQ_USER:order}"
    password: "${RABBITMQ_PASSWORD:order123456}"
    publisher-confirm-type: correlated
    publisher-returns: true
    template.mandatory: true
    listener.simple: { default-requeue-rejected: false, retry.enabled: true, retry.max-attempts: 4, retry.initial-interval: 500ms, retry.multiplier: 2 }
service-url: { product: "${PRODUCT_URL:http://localhost:8082}", inventory: "${INVENTORY_URL:http://localhost:8083}", payment: "${PAYMENT_URL:http://localhost:8085}" }
debug.failure: { inventory-after-reserve: false, order-before-commit: false, mq-publish: false, payment-notify: false }
management.endpoints.web.exposure.include: health,info,prometheus
